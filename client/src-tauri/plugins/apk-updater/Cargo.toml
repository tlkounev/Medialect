[package]
name = "tauri-plugin-apk-updater"
version = "0.1.0"
authors = ["tlkounev"]
description = "Medialect Android helpers: APK self-updates, background synchronisation service"
edition = "2021"
links = "tauri-plugin-apk-updater"

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
