services:
  medialect:
    image: ghcr.io/tlkounev/medialect:latest
    pull_policy: always
    container_name: medialect
    restart: unless-stopped
    ports:
      - "8890:8890"
    environment:
      - TZ=Europe/Prague
    volumes:
      - medialect-data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # automatic updates: checks GitHub (ghcr.io) every hour and recreates only containers
  # labelled com.centurylinklabs.watchtower.enable=true (maintained fork of containrrr/watchtower)
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: medialect-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Prague
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true

volumes:
  medialect-data:
