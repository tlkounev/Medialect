<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medialect</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <header>
    <strong class="logo"><img src="/static/icon.svg" alt="" class="logo-img">Medialect <a id="appVersion" class="version" target="_blank" rel="noopener"></a></strong>
    <nav>
      <button data-tab="catalog" class="active" data-i18n="nav.catalog">Katalog</button>
      <button data-tab="admin" data-i18n="nav.admin">Administrace</button>
    </nav>
    <button id="syncBadge" class="sync-badge hidden" data-i18n-title="sync.badgeTitle"></button>
    <label class="lang-picker" data-i18n-title="lang.choose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
      <select id="uiLang" data-i18n-aria="lang.choose"></select>
    </label>
    <button id="logout" class="ghost hidden web-only" data-i18n="logout">Odhlásit</button>
  </header>

  <main>
    <!-- app: a new version is available (the user decides; it can be installed later from the settings) -->
    <div id="updateBar" class="update-bar app-only hidden" role="status">
      <span></span>
      <div class="actions">
        <button type="button" id="updateNow" data-i18n="app.updateNow"></button>
        <button type="button" id="updateLater" class="ghost" data-i18n="app.later"></button>
      </div>
    </div>
    <section id="tab-catalog">
      <div class="searchbar">
        <input id="q" type="search" data-i18n-ph="search.ph" autofocus>
      </div>
      <div class="filters">
        <div class="ms" id="cProvider" data-i18n-title="aria.provider"></div>
        <div class="ms" id="cType" data-i18n-title="aria.type"></div>
        <div class="ms" id="cQuality" data-i18n-title="aria.quality"></div>
        <div class="ms" id="cVideo" data-i18n-title="aria.video"></div>
        <div class="ms" id="cAudio" data-i18n-title="aria.audio"></div>
        <div class="ms" id="cLang" data-i18n-title="aria.audioLang"></div>
        <div class="ms" id="cSub" data-i18n-title="aria.sub"></div>
        <select id="cSort" data-i18n-aria="aria.sort"></select>
        <button type="button" id="cReset" class="ghost" data-i18n="f.reset">Zrušit filtry</button>
      </div>
      <div id="syncNote" class="sync-note hidden" role="status"><span></span><div class="bar"><i></i></div></div>
      <div id="cInfo" class="muted"></div>
      <div id="catalog" class="results"></div>
      <div class="pager"><button id="cPrev" class="ghost" data-i18n="pager.prev"></button><button id="cNext" class="ghost" data-i18n="pager.next"></button></div>
      <p id="dataBy" class="muted data-by"></p>
    </section>

    <section id="tab-admin" class="hidden">
      <div id="adminLogin" class="auth">
        <form id="authForm" class="card">
          <h2 data-i18n="login.title">Administrace</h2>
          <p id="authHint"></p>
          <input id="authPass" type="password" autocomplete="current-password" data-i18n-ph="login.pass" required minlength="8">
          <input id="authPass2" type="password" autocomplete="new-password" data-i18n-ph="login.pass2" class="hidden">
          <button type="submit" id="authBtn"></button>
          <p id="authErr" class="err"></p>
        </form>
      </div>

      <!-- first run: country -> services available there -> ratings -->
      <section id="wizard" class="settings-box wizard hidden">
        <header class="box-head"><h2 data-i18n="wiz.title">Medialect</h2><p class="muted" id="wizStep"></p></header>
        <div class="wiz-body">
          <div data-step="1">
            <p class="section-hint" data-i18n="wiz.country.h"></p>
            <label class="field"><span data-i18n="set.country"></span><select id="wizCountry"></select></label>
            <label class="field"><span data-i18n="set.language"></span><select id="wizLanguage"></select><small data-i18n="set.language.h"></small></label>
          </div>
          <div data-step="2" class="hidden">
            <h3 data-i18n="wiz.providers"></h3>
            <p class="section-hint muted" data-i18n="wiz.providers.h"></p>
            <div id="wizProviders" class="svc-grid all"></div>
          </div>
          <div data-step="3" class="hidden">
            <h3 data-i18n="wiz.ratings"></h3>
            <p class="section-hint muted" data-i18n="wiz.ratings.h"></p>
            <label class="chk"><input type="checkbox" id="wizImdb" checked> <span data-i18n="set.r.imdb"></span><small data-i18n="set.r.imdb.h"></small></label>
            <label class="chk"><input type="checkbox" id="wizTvmaze" checked> <span data-i18n="set.r.tvmaze"></span><small data-i18n="set.r.tvmaze.h"></small></label>
            <label class="chk"><input type="checkbox" id="wizCsfd"> <span data-i18n="set.r.csfd"></span><small data-i18n="set.r.csfd.h"></small></label>
          </div>
        </div>
        <div class="savebar">
          <button type="button" id="wizBack" class="ghost" data-i18n="wiz.back"></button>
          <button type="button" id="wizNext" data-i18n="wiz.next"></button>
          <button type="button" id="wizSkip" class="ghost" data-i18n="wiz.skip"></button>
          <span id="wizMsg" class="muted"></span>
        </div>
      </section>

      <div id="adminPanel" class="hidden">
        <nav class="subnav">
          <button data-sub="settings" class="active" data-i18n="sub.settings">Nastavení</button>
          <button data-sub="sync" data-i18n="sub.sync">Synchronizace</button>
        </nav>

        <div id="sub-settings">
          <!-- catalogue settings: one box, one save button -->
          <section class="settings-box">
            <header class="box-head">
              <h2 data-i18n="set.title">Nastavení katalogu</h2>
              <p class="muted" data-i18n="set.intro"></p>
            </header>
            <form id="settingsForm">
              <fieldset><legend data-i18n="set.general">Obecné</legend>
                <label class="field"><span data-i18n="set.country"></span><select name="country" id="setCountry"></select><small data-i18n="set.country.h"></small></label>
                <label class="field"><span data-i18n="set.language"></span><select name="language" id="setLanguage"></select><small data-i18n="set.language.h"></small></label>
                <label class="field"><span data-i18n="set.interval"></span><input name="sync_interval_hours" type="number" min="1" step="1"><small data-i18n="set.interval.h"></small></label>
              </fieldset>

              <fieldset><legend data-i18n="set.jw">JustWatch</legend>
                <p class="muted section-hint" data-i18n="set.jw.h"></p>
                <label class="chk"><input type="checkbox" name="justwatch.enabled"> <span data-i18n="set.enabled"></span></label>
                <label class="field"><span data-i18n="set.jw.delay"></span><input name="justwatch.request_delay_s" type="number" min="0" step="0.1"><small data-i18n="set.jw.delay.h"></small></label>
                <div class="field wide"><span data-i18n="set.jw.providers"></span><small data-i18n="set.jw.providers.h"></small>
                  <label class="chk show-all"><input type="checkbox" id="jwShowAll"> <span data-i18n="set.jw.showAll"></span></label>
                  <div id="jwProviders" class="svc-grid"></div></div>
              </fieldset>

              <fieldset class="web-only"><legend data-i18n="set.sa">Streaming Availability API</legend>
                <p class="muted section-hint" data-i18n="set.sa.h"></p>
                <label class="chk"><input type="checkbox" name="streaming_availability.enabled"> <span data-i18n="set.enabled"></span></label>
                <label class="field"><span data-i18n="set.sa.mode"></span><select name="streaming_availability.mode"><option value="direct" data-i18n="set.sa.direct"></option><option value="rapidapi">RapidAPI</option></select><small data-i18n="set.sa.mode.h"></small></label>
                <label class="field"><span data-i18n="set.sa.key"></span><input name="streaming_availability.api_key" type="password" autocomplete="off"><small data-i18n="set.sa.key.h"></small></label>
                <label class="field"><span data-i18n="set.sa.budget"></span><input name="streaming_availability.daily_budget" type="number" min="1"><small data-i18n="set.sa.budget.h"></small></label>
                <div class="field wide"><span data-i18n="set.sa.catalogs"></span><small data-i18n="set.sa.catalogs.h"></small>
                  <div id="saCatalogs" class="chips"></div></div>
              </fieldset>

              <fieldset><legend data-i18n="set.ratings">Hodnocení</legend>
                <label class="chk"><input type="checkbox" name="ratings.imdb_dataset"> <span data-i18n="set.r.imdb"></span><small data-i18n="set.r.imdb.h"></small></label>
                <label class="chk"><input type="checkbox" name="ratings.justwatch_scores"> <span data-i18n="set.r.jw"></span><small data-i18n="set.r.jw.h"></small></label>
                <label class="chk"><input type="checkbox" name="ratings.csfd"> <span data-i18n="set.r.csfd"></span><small data-i18n="set.r.csfd.h"></small></label>
                <label class="chk"><input type="checkbox" name="ratings.tvmaze"> <span data-i18n="set.r.tvmaze"></span><small data-i18n="set.r.tvmaze.h"></small></label>
                <label class="field"><span data-i18n="set.r.csfdBudget"></span><input name="ratings.csfd_daily_budget" type="number" min="0"><small data-i18n="set.r.csfdBudget.h"></small></label>
                <label class="field"><span data-i18n="set.r.tmdb"></span><input name="ratings.tmdb_api_key" type="password" autocomplete="off"><small data-i18n="set.r.tmdb.h"></small></label>
                <label class="field"><span data-i18n="set.r.omdb"></span><input name="ratings.omdb_api_key" type="password" autocomplete="off"><small data-i18n="set.r.omdb.h"></small></label>
                <label class="field"><span data-i18n="set.r.omdbBudget"></span><input name="ratings.omdb_daily_budget" type="number" min="1"><small data-i18n="set.r.omdbBudget.h"></small></label>
                <label class="field"><span data-i18n="set.r.mdb"></span><input name="ratings.mdblist_api_key" type="password" autocomplete="off"><small data-i18n="set.r.mdb.h"></small></label>
                <label class="field"><span data-i18n="set.r.mdbBudget"></span><input name="ratings.mdblist_daily_budget" type="number" min="1"><small data-i18n="set.r.mdbBudget.h"></small></label>
                <label class="field"><span data-i18n="set.r.refresh"></span><input name="ratings.refresh_days" type="number" min="1"><small data-i18n="set.r.refresh.h"></small></label>
              </fieldset>
            </form>
            <div class="savebar">
              <button type="submit" form="settingsForm" id="saveSettings" data-i18n="set.save">Uložit nastavení katalogu</button>
              <span id="saveMsg" class="muted"></span>
            </div>
          </section>

          <!-- media servers: each row has its own buttons -->
          <section class="settings-box">
            <header class="box-head">
              <h2 data-i18n="srv.title">Mediální servery</h2>
              <p class="muted" data-i18n="srv.intro"></p>
            </header>
            <div id="servers"></div>
            <button type="button" id="addServer" class="ghost" data-i18n="srv.add">+ Přidat server</button>
          </section>

          <!-- app only: updates from GitHub -->
          <section class="settings-box app-only">
            <header class="box-head"><h2 data-i18n="upd.title">Aktualizace aplikace</h2></header>
            <div class="box-body">
              <p id="updState" class="muted"></p>
              <div class="row">
                <button type="button" id="updInstall" class="hidden"></button>
                <button type="button" id="updCheck" class="ghost" data-i18n="upd.check"></button>
              </div>
            </div>
          </section>

          <!-- access: unrelated to the catalogue settings -->
          <section class="settings-box web-only">
            <header class="box-head"><h2 data-i18n="acc.title">Přístup a zabezpečení</h2></header>
            <fieldset><legend data-i18n="acc.api">API</legend>
              <p class="muted section-hint" data-i18n="acc.api.h"></p>
              <div class="row"><code id="apiToken">••••</code><button type="button" id="showToken" class="ghost" data-i18n="acc.show"></button><button type="button" id="regenToken" class="ghost" data-i18n="acc.regen"></button></div>
            </fieldset>
            <fieldset><legend data-i18n="acc.pw">Heslo</legend>
              <form id="pwForm" class="row">
                <input name="old" type="password" data-i18n-ph="acc.pwOld" required>
                <input name="new" type="password" data-i18n-ph="acc.pwNew" minlength="8" required>
                <button type="submit" class="ghost" data-i18n="acc.pwBtn"></button><span id="pwMsg" class="muted"></span>
              </form>
            </fieldset>
          </section>
        </div>

        <div id="sub-sync" class="hidden">
          <div class="row"><h2 data-i18n="sync.title">Synchronizace</h2><button id="syncAll" data-i18n="sync.runAll"></button></div>
          <div id="stats" class="muted"></div>
          <table id="jobs"></table>
          <div id="budgets" class="muted"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<template id="serverTpl">
  <div class="server">
    <div class="server-fields">
      <label><span data-i18n="srv.type"></span> <select data-k="type"><option value="emby">Emby</option><option value="jellyfin">Jellyfin</option><option value="plex">Plex</option></select></label>
      <label><span data-i18n="srv.name"></span> <input data-k="name" data-i18n-ph="srv.name.ph"></label>
      <label><span data-i18n="srv.url"></span> <input data-k="url" placeholder="http://10.0.0.5:8096"></label>
      <label><span data-i18n="srv.public"></span> <input data-k="public_url" data-i18n-ph="srv.public.ph"></label>
      <label><span data-i18n="srv.token"></span> <input data-k="token" type="password" data-i18n-ph="srv.token.ph" autocomplete="off"></label>
      <label><span data-i18n="srv.links"></span> <select data-k="link_mode">
        <option value="auto" data-i18n="srv.links.auto"></option>
        <option value="public" data-i18n="srv.links.public"></option>
        <option value="internal" data-i18n="srv.links.internal"></option>
      </select></label>
      <label class="chk"><input data-k="enabled" type="checkbox" checked> <span data-i18n="set.enabled"></span></label>
    </div>
    <div class="server-actions">
      <button type="button" class="save" data-i18n="srv.save"></button>
      <button type="button" class="ghost test" data-i18n="srv.test"></button>
      <button type="button" class="ghost danger remove" data-i18n="srv.remove"></button>
      <span class="muted result"></span>
    </div>
  </div>
</template>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
