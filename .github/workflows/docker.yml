name: Test & Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/medialect

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/run_tests.py

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous pull (package must be public)
        run: |
          docker logout ghcr.io || true
          TAG="sha-${GITHUB_SHA::7}"
          if ! docker pull "$IMAGE:$TAG"; then
            echo "::error::$IMAGE:$TAG nejde stáhnout bez přihlášení – v GitHub Packages přepni balíček na Public."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          docker run -d --name medialect -p 8890:8890 -e DISABLE_SCHEDULER=1 "$IMAGE:$TAG"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8890/api/health && curl -fsS http://127.0.0.1:8890/ | grep -q Medialect; then
              echo "OK"; exit 0
            fi
            sleep 2
          done
          docker logs medialect
          exit 1
