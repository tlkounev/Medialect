name: Test & Docker image

# Docker is paused: only built on request (Actions → Run workflow) or for a v* tag
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # creates the v1.0.x release tag
  packages: write

# one release at a time, so two quick merges never get the same version number
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/medialect

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/run_tests.py

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to find the last v1.0.x
      - id: version
        name: Version (1.0.x)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            LAST=$(git tag --list 'v1.0.*' --sort=-v:refname | head -n1)
            if [ -z "$LAST" ]; then NEXT=0; else NEXT=$(( ${LAST##*.} + 1 )); fi
            VERSION="1.0.${NEXT}"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then VERSION="${VERSION}-pr${{ github.event.number }}"; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=1.0,enable=${{ github.event_name != 'pull_request' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Release tag
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git tag "v${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.version }}"

  verify:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Anonymous pull (package must be public)
        run: |
          docker logout ghcr.io || true
          TAG="sha-${GITHUB_SHA::7}"
          if ! docker pull "$IMAGE:$TAG"; then
            echo "::error::$IMAGE:$TAG cannot be pulled without logging in – make the package Public in GitHub Packages."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          docker run -d --name medialect -p 8890:8890 -e DISABLE_SCHEDULER=1 "$IMAGE:$TAG"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8890/api/health && curl -fsS http://127.0.0.1:8890/ | grep -q Medialect \
             && curl -fsS http://127.0.0.1:8890/api/auth/state | grep -q '"version":"${{ needs.image.outputs.version }}"'; then
              echo "OK"; exit 0
            fi
            sleep 2
          done
          docker logs medialect
          exit 1
